<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Robbi module connection overview</title>
<desc id="desc">Pi, custom PCB and peripherals. Lines identify logical connections, not connector pin order.</desc>
<rect width="1400" height="760" rx="24" fill="#eff4f4"/>
<style>text{font-family:Arial,sans-serif;fill:#173441}.title{font-size:34px;font-weight:bold}.sub{font-size:21px;fill:#49636e}.label{font-size:23px;font-weight:bold}.note{font-size:18px;fill:#49636e}.box{fill:white;stroke:#aac1c7;stroke-width:2}.wire{fill:none;stroke:#0a897e;stroke-width:4;stroke-linejoin:round}</style>
<text x="50" y="62" class="title">Where each module connects</text>
<text x="50" y="101" class="sub">Functional overview • use the released connector drawing for voltages and pin order</text>
<path class="wire" d="M380 245H500 M380 430H500 M380 610H450V465H500 M900 215H1030 M900 305H1030 M900 395H1030 M900 485H1030 M700 550V610"/>
<rect class="box" x="50" y="185" width="330" height="120" rx="14"/><text x="80" y="232" class="label">IMX219 camera</text><text x="80" y="268" class="note">CSI ribbon → Pi camera socket</text>
<rect class="box" x="50" y="370" width="330" height="120" rx="14"/><text x="80" y="417" class="label">USB microphone</text><text x="80" y="453" class="note">OTG adapter → Pi USB data</text>
<rect class="box" x="50" y="550" width="330" height="120" rx="14"/><text x="80" y="597" class="label">Single 18650 + holder</text><text x="80" y="633" class="note">Verified protection / polarity → BAT</text>
<rect x="500" y="150" width="400" height="400" rx="20" fill="#153a48"/>
<text x="535" y="204" style="fill:white;font-size:28px;font-weight:bold">Pi Zero 2 W</text>
<text x="535" y="244" style="fill:#c4dbe2;font-size:20px">40-pin connection to custom PCB</text>
<path d="M535 276H865" stroke="#66838d" stroke-width="2"/>
<text x="535" y="320" style="fill:#e5fb60;font-size:28px;font-weight:bold">Robbi custom board</text>
<text x="535" y="368" style="fill:white;font-size:22px">Motor driver · audio amplifier</text>
<text x="535" y="409" style="fill:white;font-size:22px">IMU · power circuitry</text>
<text x="535" y="483" style="fill:#c4dbe2;font-size:19px">No duplicate breakout modules needed</text>
<rect class="box" x="1030" y="165" width="320" height="100" rx="14"/><text x="1055" y="206" class="label">Face display</text><text x="1055" y="239" class="note">SPI / LCD header</text>
<rect class="box" x="1030" y="280" width="320" height="75" rx="14"/><text x="1055" y="324" class="label">Forward ToF → H1</text>
<rect class="box" x="1030" y="375" width="320" height="75" rx="14"/><text x="1055" y="419" class="label">Speaker → SPEAKER</text>
<rect class="box" x="1030" y="470" width="320" height="100" rx="14"/><text x="1055" y="511" class="label">Left + right motors</text><text x="1055" y="544" class="note">Each: motor pair + encoder signals</text>
<rect class="box" x="500" y="610" width="400" height="60" rx="12"/><text x="525" y="648" class="note">H2 / servo outputs: unused in this build</text>
<text x="50" y="721" class="note">Connections shown schematically. This drawing does not depict power isolation, protection devices or physical wire order.</text>
</svg>
