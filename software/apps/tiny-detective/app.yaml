api_version: 2
id: tiny-detective
name: Tiny Detective
version: 1.1.1
description: Investigate twelve original little mysteries, inspect clues, ask for hints and deduce the
  answer.
permissions:
- state
- robot.display
- robot.audio
triggers:
- Play Tiny Detective
- Solve a little mystery
dashboard:
  page: dashboard/index.html
tools:
- name: play
  description: Start the next unsolved case or select 1–12. Inspect a returned clue ID, request a non-spoiler
    hint, or guess an exact choice. Only solving or skipping reveals the solution. Completed cases earn
    points once.
  timeout_s: 10
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - start
        - inspect
        - hint
        - guess
        - skip
        - status
        - stop
        default: status
      case:
        type: integer
        minimum: 0
        maximum: 12
        default: 0
        title: Case; 0 is next unsolved
      clue:
        type: string
        maxLength: 40
        default: ''
      answer:
        type: string
        maxLength: 160
        default: ''
config_schema:
  type: object
  properties:
    screen:
      type: boolean
      default: true
      title: Show clues on Robbi
    play_sound:
      type: boolean
      title: Play the app sound
      default: true
author:
  name: Robbi project
requires:
  sdk: 2
  runtime: '>=2.1.1,<3.0.0'
  python: '>=3.11,<3.13'
  dependencies: []
category: games
tags:
- mysteries
- deduction
- stories
images:
  icon: images/icon.png
  screen: images/screen.png
