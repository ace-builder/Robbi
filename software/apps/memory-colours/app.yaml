api_version: 2
id: memory-colours
name: Colour memory
version: 1.1.1
entrypoint: main:run
description: Watch a growing sequence of coloured pads, then say the colours in order.
permissions:
- state
- robot.display
- robot.audio
triggers:
- Play memory colours
- Red blue yellow
- Repeat sequence
dashboard:
  title: Colour memory
  description: Watch a growing sequence of coloured pads, then say the colours in order.
tools:
- name: play
  title: Play
  description: Start a game and watch the coloured pads. Repeat their colours in order, one at a time
    or together. Use status to replay the sequence.
  timeout_s: 20
  input_schema:
    type: object
    properties:
      action:
        type: string
        title: Action
        maxLength: 160
        enum:
        - start
        - move
        - status
        - stop
        default: move
      answer:
        type: string
        title: Your move
        maxLength: 160
        default: ''
config_schema:
  type: object
  properties:
    sound:
      type: boolean
      title: Victory sound
      default: true
    rounds:
      type: integer
      title: Rounds to win
      minimum: 2
      maximum: 8
      default: 5
author:
  name: Robbi project
requires:
  sdk: 2
  runtime: '>=2.1.1,<3.0.0'
  python: '>=3.11,<3.13'
  dependencies:
  - name: Pillow
    version: '>=11.3,<13'
category: games
tags:
- memory
- colours
- offline
images:
  icon: images/icon.png
  screen: images/screen.png
