api_version: 2
id: tic-tac-toe
name: Tic-tac-toe
version: 1.1.1
entrypoint: main:run
description: Play on Robbi’s screen. You are X; say top right, center or a square number.
permissions:
- state
- robot.display
- robot.audio
triggers:
- Play tic tac toe
- Top right
- Put it in the center
dashboard:
  title: Tic-tac-toe
  description: Play on Robbi’s screen. You are X; say top right, center or a square number.
tools:
- name: play
  title: Play
  description: Start a game, choose a square by name or number, show the board, or stop. You play X; Robbi
    takes the next turn.
  timeout_s: 20
  input_schema:
    type: object
    properties:
      action:
        type: string
        title: Action
        maxLength: 160
        enum:
        - start
        - move
        - status
        - stop
        default: move
      answer:
        description: Spoken answer as text, including digits or English/German number words (for example 1, one, eins, or Nummer 1).
        type: string
        title: Your move
        maxLength: 160
        default: ''
config_schema:
  type: object
  properties:
    sound:
      type: boolean
      title: Victory sound
      default: true
    difficulty:
      type: string
      title: Difficulty
      maxLength: 160
      enum:
      - easy
      - normal
      default: normal
author:
  name: Robbi project
requires:
  sdk: 2
  runtime: '>=2.1.1,<3.0.0'
  python: '>=3.11,<3.13'
  dependencies:
  - name: Pillow
    version: '>=11.3,<13'
category: games
tags:
- strategy
- board-game
- offline
images:
  icon: images/icon.png
  screen: images/screen.png
