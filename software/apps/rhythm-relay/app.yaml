api_version: 2
id: rhythm-relay
name: Rhythm Relay
version: 1.1.1
description: Copy generated clap patterns solo or together; score real microphone claps or dashboard taps.
permissions:
- state
- robot.display
- robot.audio
- robot.microphone
triggers:
- Play Rhythm Relay
- Copy a clap pattern
dashboard:
  page: dashboard/index.html
tools:
- name: play
  description: Start a fresh adaptive pattern, replay it, submit absolute tap times in milliseconds, or
    listen briefly for real claps. Cooperative players alternate claps. Status never records audio.
  timeout_s: 25
  input_schema:
    type: object
    properties:
      action:
        type: string
        enum:
        - start
        - replay
        - attempt
        - listen
        - status
        - stop
        default: status
      tap_times_ms:
        type: array
        maxItems: 16
        items:
          type: number
          minimum: 0
          maximum: 15000
        default: []
config_schema:
  type: object
  properties:
    mode:
      type: string
      enum:
      - solo
      - cooperative
      default: solo
    level:
      type: integer
      minimum: 1
      maximum: 5
      default: 1
      title: Initial level
    bpm:
      type: integer
      minimum: 100
      maximum: 160
      default: 120
      title: Tempo
    sound:
      type: boolean
      default: true
      title: Robot sound
    screen:
      type: boolean
      default: true
      title: Robot screen
author:
  name: Robbi project
requires:
  sdk: 2
  runtime: '>=2.1.1,<3.0.0'
  python: '>=3.11,<3.13'
  dependencies:
  - name: Pillow
    version: '>=11.3,<13'
category: games
tags:
- rhythm
- music
- timing
images:
  icon: images/icon.png
  screen: images/screen.png
