api_version: 2
id: expense-tracker
name: Expense tracker
version: 1.1.0
entrypoint: main:run
description: Keep a small local expense log and total spending separately for each currency.
permissions:
- state
- robot.display
- robot.audio
triggers:
- Log 12.50 euros for lunch
- Show this month's expenses
tools:
- name: add
  title: Add expense
  description: Record one positive expense, rounding to two decimal places. This writes an entry each
    time; avoid repeating a successful call.
  timeout_s: 5
  input_schema:
    type: object
    properties:
      amount:
        type: number
        title: Amount
        minimum: 0.001
        maximum: 1000000000
        x-order: 0
      currency:
        type: string
        title: Currency label
        maxLength: 3
        default: EUR
        x-order: 10
      category:
        type: string
        title: Category
        maxLength: 40
        default: General
        x-order: 20
      description:
        type: string
        title: Description
        maxLength: 120
        default: ''
        x-order: 30
      date:
        type: string
        title: Expense date
        maxLength: 10
        description: YYYY-MM-DD; empty means today in the configured timezone.
        default: ''
        x-order: 40
    required:
    - amount
- name: list
  title: List expenses and totals
  description: List expenses within optional inclusive start/end dates and optional currency; totals never
    mix currencies.
  timeout_s: 5
  input_schema:
    type: object
    properties:
      start:
        type: string
        title: From date
        maxLength: 10
        default: ''
        x-order: 0
      end:
        type: string
        title: Through date
        maxLength: 10
        default: ''
        x-order: 10
      currency:
        type: string
        title: Currency filter
        maxLength: 3
        default: ''
        x-order: 20
- name: remove
  title: Remove expense
  description: Permanently remove only the expense with this exact ID from a previous list result.
  timeout_s: 5
  input_schema:
    type: object
    properties:
      id:
        type: string
        title: Expense ID
        maxLength: 12
        minLength: 12
        x-order: 0
    required:
    - id
config_schema:
  type: object
  properties:
    timezone:
      type: string
      title: Local timezone
      maxLength: 80
      description: IANA timezone used for today and empty date fields.
      default: Europe/Berlin
      x-order: 0
    show_screen:
      type: boolean
      title: Illustrated result on Robbi
      default: true
    play_sound:
      type: boolean
      title: Play the app sound
      default: false
author:
  name: Robbi project
requires:
  sdk: 2
  runtime: '>=2.1.0,<3.0.0'
  python: '>=3.11,<3.13'
  dependencies: []
category: productivity
tags:
- budgeting
- expenses
- offline
images:
  icon: images/icon.png
  screen: images/screen.png
